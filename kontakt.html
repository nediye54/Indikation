<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kontakt – MDG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <style>
    .form { display:grid; gap:.75rem; }
    .form__label { font-family:var(--font-mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2); margin-top:.2rem; }
    .form__input { width:100%; padding:.65rem .9rem; border-radius:10px; border:1px solid var(--stroke2); background:rgba(255,255,255,.04); color:var(--text); font-family:var(--font-body); font-size:1rem; font-weight:300; outline:none; transition:border-color .15s; }
    .form__input:focus { border-color:rgba(110,231,183,.4); }
    textarea.form__input { resize:vertical; }
    .form__check { display:flex; gap:.6rem; align-items:flex-start; color:var(--muted); font-size:.9rem; font-weight:300; margin:.2rem 0 .4rem; }
    .form__status { display:none; padding:.65rem 1rem; border-radius:10px; font-size:.85rem; font-weight:300; margin-top:.2rem; }
    .form__status--ok { background:rgba(110,231,183,.1); border:1px solid rgba(110,231,183,.25); color:var(--primary); }
    .form__status--err { background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.2); color:var(--danger); }
  </style>
</head>
<body>
<header class="header">
  <div class="header__inner container">
    <a class="brand" href="./index.html">MDG</a>
    <nav class="nav">
      <a class="nav__link" href="./how.html" data-i18n="nav.how">Wie es funktioniert</a>
      <a class="nav__link" href="./why.html" data-i18n="nav.why">Warum MDG</a>
      <a class="nav__link" href="./faq.html" data-i18n="nav.faq">FAQ</a>
    </nav>
    <div class="header__actions">
      <div class="lang">
        <button class="chip chip--ghost" type="button" data-lang="de" aria-pressed="true">DE</button>
        <button class="chip chip--ghost" type="button" data-lang="tr" aria-pressed="false">TR</button>
        <button class="chip chip--ghost" type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <button class="burger" id="burgerBtn" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
<div class="drawer" id="drawer" hidden>
  <a class="drawer__link" href="./how.html" data-i18n="nav.how">Wie es funktioniert</a>
  <a class="drawer__link" href="./why.html" data-i18n="nav.why">Warum MDG</a>
  <a class="drawer__link" href="./faq.html" data-i18n="nav.faq">FAQ</a>
  <div class="drawer__sep"></div>
  <div class="lang">
    <button class="chip chip--ghost" type="button" data-lang="de" aria-pressed="true">DE</button>
    <button class="chip chip--ghost" type="button" data-lang="tr" aria-pressed="false">TR</button>
    <button class="chip chip--ghost" type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</div>
<main>
<div class="page">
  <div class="section__head">
    <h1 class="h1">Kontakt</h1>
    <p class="sub">Schreib uns. Wir antworten strukturiert.</p>
  </div>
  <div class="grid-2">
    <div class="card">
      <h2 class="h3">Direkt</h2>
      <p class="sub" style="margin-top:.75rem;">E-Mail: <a href="mailto:info@mdg-indikation.de">info@mdg-indikation.de</a></p>
    </div>
    <div class="card">
      <h2 class="h3">Formular</h2>
      <form class="form" id="contactForm" style="margin-top:1rem;">
        <label class="form__label" for="name">Name</label>
        <input class="form__input" id="name" name="name" type="text" placeholder="Dein Name" autocomplete="name" />
        <label class="form__label" for="email">E-Mail *</label>
        <input class="form__input" id="email" name="email" type="email" placeholder="name@domain.com" required />
        <label class="form__label" for="message">Nachricht *</label>
        <textarea class="form__input" id="message" name="message" rows="5" placeholder="Kurz: System, Problem, Ziel." required></textarea>
        <label class="form__check">
          <input type="checkbox" id="privacy" required />
          <span>Ich habe die <a href="./datenschutz.html">Datenschutzerklärung</a> gelesen.</span>
        </label>
        <div class="form__status" id="formStatus"></div>
        <button class="btn btn--primary" type="submit" id="submitBtn">Senden</button>
      </form>
    </div>
  </div>
</div>
</main>
<footer class="footer">
  <div class="footer__grid">
    <a class="brand" href="./index.html" style="font-size:.85rem;letter-spacing:.18em;">MDG</a>
    <div class="footer__legal">
      <a href="./impressum.html">Impressum</a>
      <a href="./datenschutz.html">Datenschutz</a>
      <a href="./kontakt.html">Kontakt</a>
      <a href="https://www.hugendubel.de/de/search?q=moral+des+gleichgewichts" target="_blank" rel="noopener">Bücher</a>
    </div>
  </div>
</footer>
<script>
(()=>{
  const burger = document.getElementById("burgerBtn");
  const drawer = document.getElementById("drawer");
  if(burger && drawer){
    burger.addEventListener("click",()=>{ drawer.hidden=!drawer.hidden; document.body.style.overflow=drawer.hidden?"":"hidden"; });
    drawer.addEventListener("click",e=>{ if(e.target===drawer){ drawer.hidden=true; document.body.style.overflow=""; }});
    window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ drawer.hidden=true; document.body.style.overflow=""; }});
  }
  const ls=localStorage;
  function applyLang(lang){ if(!lang)lang="de"; ls.setItem("mdg_lang",lang); document.documentElement.lang=lang; document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang))); }
  document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>applyLang(b.dataset.lang)));
  applyLang(ls.getItem("mdg_lang")||"de");
})();
</script>
<script>
(()=>{
  const WEB3FORMS_KEY = "3099d841-ee8e-48cc-a502-b9fcb7c60829";
  const form = document.getElementById("contactForm");
  const status = document.getElementById("formStatus");
  const submitBtn = document.getElementById("submitBtn");
  function showStatus(msg, ok) {
    status.textContent = msg;
    status.className = "form__status " + (ok ? "form__status--ok" : "form__status--err");
    status.style.display = "block";
  }
  form.addEventListener("submit", async e => {
    e.preventDefault();
    submitBtn.disabled = true; submitBtn.textContent = "Wird gesendet…";
    status.style.display = "none";
    const payload = {
      access_key: WEB3FORMS_KEY,
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      subject: "[MDG Kontakt]",
      message: document.getElementById("message").value.trim(),
    };
    try {
      const res = await fetch("https://api.web3forms.com/submit", {
        method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(()=>({}));
      if(res.ok && data.success) { showStatus("✓ Nachricht gesendet.", true); form.reset(); }
      else showStatus("Fehler – bitte erneut versuchen.", false);
    } catch { showStatus("Verbindungsfehler.", false); }
    finally { submitBtn.disabled=false; submitBtn.textContent="Senden"; }
  });
})();
</script>
</body>
</html>
